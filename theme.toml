# theme.toml template for a Hugo theme
# See https://github.com/gohugoio/hugoThemesSiteBuilder/tree/main#theme-configuration

name = "Evershibui"
license = "MIT"
licenselink = "https://github.com/9zxu/evershibui/blob/main/LICENSE"
description = "A minimal, quiet Hugo blog theme combining Everforest color palettes with Shibui-inspired simplicity."
homepage = "https://github.com/9zxu/evershibui"
demosite = "https://9zxu.github.io"

tags = [
  "blog",
  "minimal",
  "personal",
  "responsive",
  "dark",
]

features = [
  "responsive",
  "dark mode",
  "syntax highlighting",
  "tags",
  "custom color palette",
  "math (KaTeX)",
]

min_version = "0.146.0"

[author]
  name = "9zxu"
  homepage = "https://github.com/9zxu"
